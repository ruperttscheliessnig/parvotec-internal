<script>
const DATA = [{"n": 1, "ts": "0:00–1:31", "key": "He's going to talk to us about the directed evolution of muscular and neuromuscular capsid variants in both mice and non-human primates.", "full": "I hope you guys had a wonderful conference so far. Have a great day ahead. Welcome to the AV Capsit Engineering 4 session. I'm Saurav Chaudhary. Before we begin, I have a couple of quick reminders, which you've probably heard before. As a reminder, the use of flash photography and filming is prohibited during the session. I'm supposed to tell you that there is Wi-Fi and there is an app, but if you have not used it, that's why you're not going to use it now, so it should be good. And your feedback is incredibly useful to us. I'll circle back on that topic at the end. So without further ado, it's my pleasure to welcome Tyler Moyr from Voyager Therapeutics. He's going to talk to us about the directed evolution of muscular and neuromuscular capsid variants in both mice and non-human primates. Tyler, take it away. All right, thank you for that introduction, and thank you to the organizers for allowing me to share this work with you all that we've been working on for the past few years. What I'm going to talk about today is actually probably a bit of a different direction for Voyager Therapeutics. If you're familiar with our work, you know, of our work more in the CNS and gene therapy space for neurodegenerative disorders. But today, I'm going to talk about some work that we've done developing novel capsids for muscular and neuromuscular indications.", "img": "frames/AAV_Engineering_IV/f0001.jpg"}, {"n": 2, "ts": "1:34–3:06", "key": "So at Voyager, we've developed the tracer platform, which is an RNA-based AAV capsid evolution platform that allows us to evolve and engineer capsids with tissue-specific targeting for maximal gene delivery to a given tissue of interest.", "full": "So at Voyager, we've developed the tracer platform, which is an RNA-based AAV capsid evolution platform that allows us to evolve and engineer capsids with tissue-specific targeting for maximal gene delivery to a given tissue of interest. And of course, as I mentioned, we first applied the tracer platform to engineer transformative BBB penetrant AAV vectors for CNS-specific disorders. And on that note, I hope you all got the opportunity to hear our chief scientific officer, Todd Carter, present this past Wednesday morning about the development of VY-1706. And that is our gene therapy product for Alzheimer's disease. It's a tau knockdown. We're really excited about the three-month GLP tox data that he presented, and we're hoping to take that into the clinic later this year. So please stay tuned. But of course, outside of the CNS and beyond the BBB, there is need across many therapeutic areas for better, safer, stronger AAV capsids for gene therapy programs. And that's what I'm going to talk about here momentarily. So given that this is capsid engineering four, by now I presume many of you are familiar with the and overall capsid engineering platform overview.", "img": "frames/AAV_Engineering_IV/f0002.jpg"}, {"n": 3, "ts": "3:07–4:36", "key": "And in fact, in the monkeys, some that were improved upon a known monkey benchmark muscle capsid.", "full": "So for us, instead of processing brain tissue, we can easily just choose another tissue of interest. And now we've begun working in skeletal muscle and cardiac muscle. So we did this over the past few years. We launched a number of campaigns to identify muscle-specific capsids. And here I'm showing the results of one of our campaigns. We're looking at the enrichment of a number of pooled variants in a synomologous macaque muscle and mouse muscle relative to AAV9. And we were able to uncover a host of variants that showed enrichment in the muscles in both of those species. And in fact, in the monkeys, some that were improved upon a known monkey benchmark muscle capsid. So we chose a collection of these to begin evaluating and we were able to quite easily evaluate a lot of them in mice, so that's where I'll start. So relative to AAV9, we examined a bunch of capsids and when we looked at whole body and vivo imaging, we had a number of capsids that had substantial muscle targeting globally in muscles relative to AAV9. And they were on the order or in some cases, better than the benchmark capsid that we evaluated. So we chose one of these capsids. We denote it VCAP290 and we'll take a closer look at that one.", "img": "frames/AAV_Engineering_IV/f0003.jpg"}, {"n": 4, "ts": "4:38–6:09", "key": "So when we looked at VCAP290's ability to deliver a transgene here to the muscles, what we saw was just really a substantial increase over AAV9 in all muscle tissues that we examined.", "full": "So when we looked at VCAP290's ability to deliver a transgene here to the muscles, what we saw was just really a substantial increase over AAV9 in all muscle tissues that we examined. And again, sort of at the level or better than a benchmark capsid. And that was confirmed when we did more bioanalytics on it. In mice, VCAP290 had about 100-fold improvement in expression over AAV9. In heart tissue, it was about 10-fold improved. And we want to note that in liver, we actually did see a mild detargeting in terms of biodistribution to the liver. Now, when we first looked at these muscle capsids, we were at least these images, these histology images, we were really struck and it looked at this global view like we were really hitting every single muscle fiber and at this dose. And we confirmed that when we zoomed in a bit in skeletal muscle at this dose of 2.5 E13 VGs per KIG, which therapeutically would say is a low dose compared to what's being used in the clinic, we were hitting every muscle fiber. So we decided to take that even lower and we did a five-fold reduction in dose down to five E12 VGs per KIG. And again, we were able to hit 100% of skeletal muscle fibers, although we are seeing more variation in on a fiber-by-fiber basis.", "img": "frames/AAV_Engineering_IV/f0004.jpg"}, {"n": 5, "ts": "6:10–7:41", "key": "In this case, we're gonna look at AEV9, a primate benchmark muscle capsid and VCAP290 and we put them head-to-head in the exact same macaques.", "full": "So at this point, I'm gonna switch over to our evaluation of VCAP290 in cinemulgus macaques and we switched trans genes here and we go into what we presented a few years ago as what we call sort of our multi-tag system. This is our ability to take a number of capsids of interest. In this case, we're gonna look at AEV9, a primate benchmark muscle capsid and VCAP290 and we put them head-to-head in the exact same macaques. Each capsid is dosed pretty low at four E12 VGs per KIG and each is packaged with a histone trans gene, each with a unique epitope tag so that we can differentiate the capsids based on in histology or bioanalytics. And another note before I show the data is that with a histone trans gene, we aren't gonna see that fiber-wide staining like we saw in the mouse with the cytosolic protein. You're just gonna see targeting in the nuclei that are squeezed up against the cell membrane there in the muscle fibers. But nevertheless, we can still quantify the targeting to the muscle tissue and in the macaque quadriceps, we were able to see about 30% of nuclei being targeted by VCAP290 as opposed to about 6% in AEV9. And in terms of expression, we saw about 25-fold increase in trans gene expression relative to AEV9,", "img": "frames/AAV_Engineering_IV/f0005.jpg"}, {"n": 6, "ts": "7:41–9:13", "key": "So we performed an evolution scheme with VCAP290 and we really focused choosing capsids to move forward with that had increased expression in muscle tissue in monkeys, which I'm showing here, but also mouse as well, but detargeting of those peripheral tissues like the liver.", "full": "both of those metrics exceeding the benchmark capsid that we evaluated. When we look at heart, we saw a similar thing where VCAP290 was hitting about 20% of nuclei in the heart at this dose of 40-12 and that led to about a 13-fold increase in expression relative to AEV9. We also evaluated some peripheral tissues. So in the DRGs, we noted a mild detargeting with VCAP290 relative to AEV9, but in the liver, we actually did see an increase in targeting, but we really saw that as an opportunity to continue to develop VCAP290 and push it into a second generation of evolution. So we performed an evolution scheme with VCAP290 and we really focused choosing capsids to move forward with that had increased expression in muscle tissue in monkeys, which I'm showing here, but also mouse as well, but detargeting of those peripheral tissues like the liver. We're well underway with evaluating a number of these. We have some exciting data thus far and we hope to share that in the future. But I'm gonna switch gears just a little bit and talk about neuromuscular capsids.", "img": "frames/AAV_Engineering_IV/f0006.jpg"}, {"n": 7, "ts": "9:13–10:45", "key": "But of course, in between these two ideas, there's a therapeutic need for neuromuscular disorders where you want capsids that have broad CNS transduction as well as enhanced muscle tropism.", "full": "And the inspiration for our work here is that we took a look and we have done a lot of work in the CNS space and we've developed some great capsids that we're excited about like VCAP Gen2. And I just described our work that we are now developing muscle capsids like VCAP290. But of course, in between these two ideas, there's a therapeutic need for neuromuscular disorders where you want capsids that have broad CNS transduction as well as enhanced muscle tropism. So we set out to evolve or engineer capsids that are capable of this. And I'm gonna share results of two separate capsids today. These are VCAP336 and 337. So VCAP336 is really just gonna be our first sort of proof of concept in mouse. And then 337 is the capsid that we evaluate in primates. So I'll start with VCAP336. So we're gonna compare it in the benchmark muscle mouse capsid as well as VCAP Gen2 our own muscle capsid or brain capsid. And we can see that the benchmark capsid when you look at skeletal muscle or heart tissue, you get really strong targeting. Not so much in the motor cortex that are in the brain. VCAP Gen2 of course has the exact opposite phenotype where we don't see much targeting in muscles,", "img": "frames/AAV_Engineering_IV/f0007.jpg"}, {"n": 8, "ts": "10:45–12:17", "key": "So here we're using AAV9, a benchmark muscle capsid, and our neuromuscular capsid VCAP337.", "full": "but certainly in the motor cortex we see quite a strong tropism. And of course the question is, do we get a best of both worlds capsid where we combine those phenotypes? And in mice that's what we saw. With VCAP336 we were able to successfully increase the targeting in the skeletal muscle and heart, certainly relative to the baseline of where the brain capsid was. And in the cortex we still have a really strong targeting. You can see there in the histology, although we note that in terms of expression in the brain we did take a little bit of a hit. But nevertheless I think this validates our approach that we are in fact getting a best of both worlds capsid that we can target both of these tissues simultaneously with one product. And interestingly in the liver, we noted that VCAP336 took on the liver phenotype more so of our CNS capsids, which are quite liver detargeted. So switching over to monkeys, we're gonna revisit that multi-tag system that I described where we do a head-to-head evaluation in the same primates of various capsids. So here we're using AAV9, a benchmark muscle capsid, and our neuromuscular capsid VCAP337. So in terms of the quadriceps, we saw an increase with VCAP337 relative to the benchmark in terms of its ability to target the cells.", "img": "frames/AAV_Engineering_IV/f0008.jpg"}, {"n": 9, "ts": "12:17–13:47", "key": "337 targeted a higher amount of nuclei in the heart as well as increased this expression about 10-fold relative to that of AAV9.", "full": "We're seeing an increase in the amount of nuclei targeted. Although we do note that we saw a little bit of a reduction there in the expression in the quadriceps. But in the heart, we were able to see an increase in both of those metrics. 337 targeted a higher amount of nuclei in the heart as well as increased this expression about 10-fold relative to that of AAV9. But I think the brain is actually where we see our most exciting data. So VCAP337 in the motor cortex of these primates had upwards of 50% of nuclei being targeted in the motor cortex. And that led to about, that was measured at about a 250-fold increase in AAV9 over, or with VCAP337. Now if we compare that to VCAPGEN2, and I'll make the stipulation here that VCAPGEN2 is data taken from some historical data that we have, and we presented years ago here at ASGCT. But in terms of the number of nuclei targeted and the amount of expression that we're seeing, we're more than doubling in either case, which we think is really exciting. In the liver, we see the same thing that we saw on mouse in that VCAP337 is largely reduced and more similar to our CNS crossing capsids", "img": "frames/AAV_Engineering_IV/f0009.jpg"}, {"n": 10, "ts": "13:47–15:16", "key": "So to just give you a summary of what I described here, we've developed muscle capsids with VCAP290, has about a hundred fold increase in expression over AAV9 in mouse skeletal muscle, 10 fold in cardiac muscle.", "full": "than they are the muscle capsids. I will make the disclaimer disclosure here that the brain targeting mechanism of both 336 and 337 is in fact ALPL, that is the mechanism by which they are getting into the BBB. And we are continuing to evolve these where we have next generation variants beyond 336 and 337 that we're currently evaluating. So to just give you a summary of what I described here, we've developed muscle capsids with VCAP290, has about a hundred fold increase in expression over AAV9 in mouse skeletal muscle, 10 fold in cardiac muscle. In primates, we're looking at 25 fold over AAV9 in the skeletal muscle and about 13 fold in heart. At low doses, we can see that we're targeting 100% of muscle fibers in the mice. And we've moved on to developing neuromuscular capsids that we think have sort of the best of both worlds there with VCAP336 and 337 and those are liver-detargeted more similar to our brain capsids. So with that, I wanna thank all my colleagues at Voyager, current and former. As you all know, these projects take a lot of brain, a lot of muscle, so it's gonna give a shout out to them. And with whatever time is remaining, I'll be happy to take a question or two.", "img": "frames/AAV_Engineering_IV/f0010.jpg"}, {"n": 11, "ts": "15:18–16:49", "key": "Moving forward, the next generation of variants that we are evaluating, we're same capsid, both animals.", "full": "I think we have time for one good question. I tell you, thanks, really exciting. I was wondering, does 336 work in NHP and does 337 work in mice? We did not test them in the other species. So I just can't say for certain. I think to some degree they both would work in the other species, but to what degree I just can't say because we didn't do that experiment. Moving forward, the next generation of variants that we are evaluating, we're same capsid, both animals. Thanks. Thank you, Tyler. Our next speaker is Nolan Graham from UC San Diego. He'll be talking about receptor-guided avetropism engineering via MATCH. Thank you. Awesome. Hello everyone, my name's Nolan Graham. I'm a PhD student in the lab of Dr. Prashant Mali at UC San Diego and today I'll be talking about my research, which is titled receptor-guided avetropism engineering via MATCH. So several of the main issues with AV gene therapy, including high cost and toxicity, stand to be overcome through the development of more specific, efficient vectors. Classically, these are identified through large-scale screens, which are resource-intensive", "img": "frames/AAV_Engineering_IV/f0011.jpg"}, {"n": 12, "ts": "16:49–18:20", "key": "Specifically, we wanted to redirect the tropism of a couple of different AAVs to desired targets by conjugating, targeting ligands to the capsid via spy tags by catcher chemistry.", "full": "and generally limited by the intolerance of the AAV capsid to larger peptide insertions. So previously, we've incorporated unnatural amino acids and peptide tags into the AAV capsid. And based on this, we developed the MATCH system, which stands for modulation of AAV tropism through conjugation to homing proteins. Specifically, we wanted to redirect the tropism of a couple of different AAVs to desired targets by conjugating, targeting ligands to the capsid via spy tags by catcher chemistry. So to start, we went into AAV DJ and inserted a spy tag into one of the protruding loop regions on the VP. This was flanked by flexible GS linkers, and then we incorporated this into a fully spy tag containing capsid. These capsids were reacted overnight at room temperature with spy catcher. And upon doing so, we saw a shift in the size of the VP as a result of that covalent spy catcher attachment. We took these to TEM to ensure that we were still forming fully formed capsids. And then upon spy catcher binding, they maintained their integrity with a slight topology change. And upon going to DLS, we saw that there was a slight shift in the mean diameter of these capsids. So we wanted to preempt an issue at this point that we foresaw where for covering the entire AAV capsid with spy catcher, we wouldn't be allowing the binding of secondary receptors such as AAVR, which are required for the AAV to effectively transduce and produce.", "img": "frames/AAV_Engineering_IV/f0012.jpg"}, {"n": 13, "ts": "18:21–19:51", "key": "In hella cells, when we transduced in vitro, we saw that the fully spy tag containing capsids lost nearly all of the transduction ability that native AAV DJ has.", "full": "So to do this, we put together a panel of mosaic AAVs with various ratios of AAV DJ to AAV spy tag with many of them primarily composed of AAV DJ. In hella cells, when we transduced in vitro, we saw that the fully spy tag containing capsids lost nearly all of the transduction ability that native AAV DJ has. And this is likely due to the insertion of the spy tag peptide immediately in the heparin sulfate proteoglycan binding domain of AAV DJ. Interestingly, in the mosaic capsids, we also saw a drop in transduction ability upon spy catcher binding, which is likely due to that steric occlusion of binding sites that I mentioned before. So we took our five to one and 11 to one mosaic capsids and decided to start targeting. So first we went into resting PBMCs, which are classically a challenging target for AAV transduction, and attached either a CD3 or CD28 SCFEs to the outside of the capsid. And saw that the CD3 targeting SCFEs, particularly the SCFE1, were able to transduce the sizable portion of the resting PBMCs without prior activation. We also wanted to go for the brain and to do so attached a murine transferrin receptor binding SCFE to the outside of the capsid and injected these retroorbitally in mice. And saw that decorated capsids were able to transduce the brain much more effectively than AAV DJ by itself. So we wanted to bring this into a more popular", "img": "frames/AAV_Engineering_IV/f0013.jpg"}, {"n": 14, "ts": "19:52–21:23", "key": "AAV9 is a wild type AAV that's already used to target the CNS with engineered capsids.", "full": "wild type AAV to be more therapeutically relevant. And to do so, we decided to make match AAV9. AAV9 is a wild type AAV that's already used to target the CNS with engineered capsids. And it uses a different primary receptor from AAV DJ in that it uses galactose to bind as opposed to upper and sulfate proteoglycan. So to do so, we inserted our spot tag into both loop one and loop two, which are protruding loop regions on the VP, and flank these by either 1X or 2X flexible linkers. And upon forming full capsids with these spot tag containing VP's, we saw that both L1 and L2, loop 2X contained, were able to readily bind spot catching. Additionally, when we incorporated these into mosaic AAVs at a ratio of 11 to one, they produced capsids with titers similar to that of wild type AAV9. So we went back to our T cell targeting and used our CD3 SEFE1 and saw that upon transduction, we were able to transduce over 50% of the resting PBMC population. Additionally, when we went to murine transferrin, we were able to gain transduction ability of the brain almost a hundredfold higher than native AAV9. Based on this success, we wanted to bring this into a more therapeutically relevant space using human transferrin receptor targeting. And to do so, we put together a panel", "img": "frames/AAV_Engineering_IV/f0014.jpg"}, {"n": 15, "ts": "21:23–22:53", "key": "from the literature of SEFE's that are targeting human transferrin receptor, and used HEC cells that had either been received a safe harbor AAVS1 locust knockout or a transferrin receptor knockout via Linty CRISPR, and saw in our AAVS1 knockout cells that we were able to transduce these cells much more efficiently than AAV9, and also with efficacy comparable to that of BIHDFR1, which is this recently engineered human transferrin targeting AAV.", "full": "from the literature of SEFE's that are targeting human transferrin receptor, and used HEC cells that had either been received a safe harbor AAVS1 locust knockout or a transferrin receptor knockout via Linty CRISPR, and saw in our AAVS1 knockout cells that we were able to transduce these cells much more efficiently than AAV9, and also with efficacy comparable to that of BIHDFR1, which is this recently engineered human transferrin targeting AAV. This improvement was attenuated in the cells that received a transferrin receptor knockout, supporting the concept that we're using the transferrin receptor to do transduce. So we took this in vivo with SEFE9 and SEFE12, and used mice that express the apical domain of the human transferrin receptor, as opposed to the murine, and saw that particularly SEFE12 yielded DNA-level and mRNA-level transduction comparable to that of BIHDFR1. We looked at the protein level next, using IHC, and saw that we were getting brain-wide distribution of our transgene, again comparable to that of BIHDFR1. So this was pretty promising, but before we proceeded, we wanted to ensure that this was more applicable for many other labs. So to do so, up until this point, everything had been produced, either separately with separate protein production from AAV production", "img": "frames/AAV_Engineering_IV/f0015.jpg"}, {"n": 16, "ts": "22:53–24:26", "key": "And one of these in CD3 targeted vectors, we're able to transduce a majority of the PVMC population, while MTFR1 and HDFR1 targeted vectors transduce the brain effectively with much higher transduction ability than AAV9 and comparable transduction to that of popular engineered AAVs.", "full": "as a kind of modular system, where you could retarget AAVs. The same AAV to different targets, depending on what you conjugate. But at this point, we wanted to ensure that we could make everything together in a triple-transfection style approach. So we have our standard triple-transfection plasmids, which I'm sure many of you are familiar with. And this also includes our spy tag rep cap, which we've used up until this point in the mosaics, and then also our spy catcher ligand. So when we did this with the CD3 targeting SEFE, we got titers, similar to the wild type AAV9, once again. And when we took this in vitro, with our L1 and L2, 5 to 1 and 11 to 1 mosaics, we were able to transduce a large portion of the T-cell population, or PVMC population. So in conclusion, the match AAV platform overcomes a major challenge in the AAV engineering by allowing us to put tion in vitro versus transduction in the cell? No, the amount of spy catcher that bound to the spy tag virus when you did it in vitro as opposed to when you assembled it within the cell. Oh, yes. So we use a large excess, massive excess, for all the conjugation reactions in vitro. But when we transfect, it's about a quarter. There's 100-fold excess of protein when we do it outside the cell. But in the cell, we just transfect at a certain ratio, which is about a quarter of the total DNA transfected. OK, and the second question was, so you use spy catcher 3, but you use spy tag 1. Is there a reason you didn't use spy tag 3? Yes, so spy tag 3 is a little bit longer than spy tag 1. So spy tag 1 is only 13 amino acids. And based on the cross reactivity of spy catcher 3 and spy tag 1, we elected to ensure that our AVs would package using a smaller peptide insertion. OK, and the last question is, so when you did your different ratios, your 11 is to 1, is that just based on bulk ratios of how you estimated how many spy tags on each capsid? Yeah, so we transfect these plasmids at a molar ratio of 11 to 1 or 5 to 1. So yeah, the fact that they package similarly indicates that hopefully they will be at that appropriate ratio upon assembly. Thank you.", "img": "frames/AAV_Engineering_IV/f0018.jpg"}, {"n": 19, "ts": "27:30–29:00", "key": "He'll be talking about ACE502, an AAV5 derived capsid engineered by InVivo Directed Evolution for robust CNS transduction and liver detargeting.", "full": "Great, if there are no further questions, thank you, Nolan. Thank you. Thank you. Our next speaker is Kyle Jue. I'm waiting for his slides to come up. There you go. He'll be talking about ACE502, an AAV5 derived capsid engineered by InVivo Directed Evolution for robust CNS transduction and liver detargeting. Take it away. OK, thank you so much for your introduction. So before I start, I want to give thanks to the organized committee for having me this great opportunity to share our exciting y displaying the whole brain. And then the next question is how much percentage of the neuron cells can be transduced by ACE502? So it's depends on the region of the brain, from that the 20 to 50% of the neuron cells can be transduced by that, the ACE502. And interesting as compared to the transduction of the wild type AB5, it can be enhanced at around that 180 fold increase, especially for substantial nigra and thalamus, which is that kind of deep brain region. So next one is how we just had to have the kind of evaluation for the liver. So as you can see that AB5 is pretty much a chip expression all over the liver.", "img": "frames/AAV_Engineering_IV/f0026.jpg"}, {"n": 27, "ts": "39:46–41:16", "key": "So we believe that ACE502 could be promising kind of capsid for robust CNS transduction at the same time that liver detargeting.", "full": "And it's very similar to the pattern of the result in AB9 as well. And a little bit reduced signal in a two different capsid, the competitor capsid as well. For ACE502 at the same dose, we can achieve around 99% of the detargeting compared to the wild type, which is a very kind of comparing data that we have. So currently we're working for the identified receptor. Hopefully it's a find that some new receptor, you could be on another one transporting anything else. So based on that, we're gonna get the result very soon. So based on that, we can just pursue the original design for next generation of ACE502. So this is a wrap up, I'm in the slide for the, take a message. So basically whole brain of the non-human primate, we could achieve around 100 fold increase at the specific dose and CNS transduction. At the same time, we can lower that 99% of that liver detargeting and liver accumulations. So we believe that ACE502 could be promising kind of capsid for robust CNS transduction at the same time that liver detargeting. So that's what we are prepared today. So thank you so much for your attention. Some I'm happy to answer any question you may have. Thank you. Thank you. Thank you. Thanks, Guy. The floor's open. Did you look at the vector genome distribution? That's a good question. We are just working on that.", "img": "frames/AAV_Engineering_IV/f0027.jpg"}, {"n": 28, "ts": "41:16–42:48", "key": "Interested in know the thinking behind the choice of the base capsid, why AV5 and sort of a follow up question to that, these published capsid that you benchmark with, are they also AV5 based?", "full": "So basically we will just see then hold that, the western blood and different, the fluorescent imaging, but we wanna quantify that how much kind of the vector genome can deliver to the each cells of the, in the each different region of the brain. Yeah, especially in the liver because AV5 notoriously doesn't transduce the liver well. Yeah, that's a good, yeah. So we are gonna work on that, yeah. So we are gonna work on that, yeah. Any other questions from the floor? Maybe I'll take this opportunity to ask the question myself. Interested in know the thinking behind the choice of the base capsid, why AV5 and sort of a follow up question to that, these published capsid that you benchmark with, are they also AV5 based? And now, the reason why we chose AV5 is, yeah, it's well known as a pre-existing immunity is much lower compared to the AV9. Even though it's AV9 known to the, going to the better way to the brain. That's why we're starting from that and then relatively lower accumulation to the liver compared to the AV9. And all benchmark capsid is AV9 derived capsids. Perfect, thank you guys. Thank you. Thank you. Our next speaker is Zenhua Wu, yeah, perfect.", "img": "frames/AAV_Engineering_IV/f0028.jpg"}, {"n": 29, "ts": "42:49–44:23", "key": "As the previous two talks mentioned a lot about the random library screening, there are many different ways to screen novel libraries and novel AV capsid for seeing as penetrating capsid.", "full": "He'll be talking to us, he's from Exagenesis. He'll be talking to us about transferrin' receptor, targeting AV, achieved superior and broad CNS transduction in multiple species after intravenous administration. Zenhua, when you're ready. Thank you very much, thanks for the invitation for this great opportunity to present here at ASGCT. So this is our forward-looking statement. Our Exagenesis bio is AV-based gene therapy company focused on CNS and ophthalmology field. As the previous two talks mentioned a lot about the random library screening, there are many different ways to screen novel libraries and novel AV capsid for seeing as penetrating capsid. The random library is really great. At one time you can screen up to one million virus at one time. However, there is also caveats. Whenever there is hits you really don't know the mechanism, you really don't know which receptor binds to. So with that we really think about what we can screen seeing as penetrating capsid differently. And this is the new system that we generated. We call the receptor targeting AV engineering system. In this particular system what we do is that we come up with a transferrin' receptor binding library", "img": "frames/AAV_Engineering_IV/f0029.jpg"}, {"n": 30, "ts": "44:23–45:54", "key": "And with that transferring, preferring a library, we insert into AV and then we screen directly into directly in monkey and see whether with a no-magnetism whether you have a better chance to find a CNS penetrating capsid.", "full": "as a peptide library. And with that transferring, preferring a library, we insert into AV and then we screen directly into directly in monkey and see whether with a no-magnetism whether you have a better chance to find a CNS penetrating capsid. And we have a lot of, we use heavily on AI in terms of generating the peptide library. I'm gonna go through the details of the AI process. At the end we found a very good seeing as penetrating capsid we called RTAV-001. And when we got the capsid we really test the affinity against the human, TFR monkey, TFR, and also mouse TFR to see whether there is any difference. And the end result is the affinity against all three species are very, very similar. So we're very encouraged by that because we know if that particular capsid works in mouse, it should work in monkey and also should work in human. And also we later on did a TEM study to see whether we can figure out the binding pocket of the particular receptor and as shown here actually we did figure out the binding pocket is actually, first is allosteric. It does not hinder the detection of transferring, binding to transfer receptor.", "img": "frames/AAV_Engineering_IV/f0030.jpg"}, {"n": 31, "ts": "45:54–47:25", "key": "At the same time, we also took a look of the GDNA distribution and MRI expression in the liver and in the muscle because we have some concerns that TFR targeting AV might increase the distribution to the muscle and the liver.", "full": "And also we figured out the modern kind of magnets why this particular association really render the specificity towards the TFR receptor. So we know exactly where it binds to, we know exactly how it binds to transfer receptor. And we put this particular capsid into mice. As you can see here from the top left is the GDNA results. As we can see, we see 30 to 60% fold increase in terms of, I'm sorry, 20 to 30% increase on the GDNA. And on the top right is the MRI expression. And we see up to 60 fold increase in terms of the RNA expression. At the same time, we also took a look of the GDNA distribution and MRI expression in the liver and in the muscle because we have some concerns that TFR targeting AV might increase the distribution to the muscle and the liver. As a matter of fact, we see about a three to four fold decrease in the liver. And muscle wise, we see exactly same distribution expression compared to AV9. Of course, we put into mice and we did the, you know, histochemically staining. And as we can see on the top panels are the AV9 staining.", "img": "frames/AAV_Engineering_IV/f0031.jpg"}, {"n": 32, "ts": "47:25–48:58", "key": "At the same time, we also take a look of the transduction of marker-clear and astrocytes.", "full": "There's not much of green trenching expression. On the bottom is the RT-AV-001 as really transduced very efficiently across the brain regions. And we quantified about 50 to 80% of the neurons are actually transduced. At the same time, we also take a look of the transduction of marker-clear and astrocytes. And indeed, the RT-AV-001 can transduce some astrocytes and marker-clear. But in terms of the percentage, it's less than 5%, much less compared to neuronal transduction. Maybe because the RT-AV-001 targeting TFR and the neuronal has TFR receptor on the surface of their neurons. And also we really take a look of the RT-AV expression, whether that induce any histological change to the brain. And based on this pathological findings studies, we really don't see much change in the neuron. So prove that this is safe in mouse. Next is we really put that RT-AV into monkey studies. And because of there are a lot of reports in terms of if you switch monkey species, the AV transduction will change. So we use actually two species, monkey,", "img": "frames/AAV_Engineering_IV/f0032.jpg"}, {"n": 33, "ts": "48:58–50:28", "key": "And when we look at the distribution across other brain, other tissues, only liver, again, had a three to four fold decrease in distribution and mRNA expression and across all other regions,", "full": "sandal monkey, and also rhesus monkey. In these studies, we call those RT-AV-001 with AV-9 at the same time. Each of them is a 4E13 VG per kg dose. And when we combine them, both capsules contains the same transgene, but with different tags. So at the end of the study, we can really use IHC to study which capsules are expressing at what level. And of course, we take all the organs and all the tissues and do all the DNA mRNA and the protein expression study. This is the results from rhesus monkey. Again, on the top left is GDNA. In the middle is mRNA and on the right is the GDNA and mRNA results in all the other tissues. Very, very striking difference between AV-9 versus RT-AV-001. And for mRNA expression-wise, we reach up to 250 fold increase across all the brain regions very consistently, including the spinal cord. And when we look at the distribution across other brain, other tissues, only liver, again, had a three to four fold decrease in distribution and mRNA expression and across all other regions,", "img": "frames/AAV_Engineering_IV/f0033.jpg"}, {"n": 34, "ts": "50:28–52:01", "key": "And then when we quantify the neuronal transduction, about 30% to 70% of neurons are transduced depending on different brain regions, highly efficient.", "full": "including spleen, including muscle, including other organs are almost the same. So has slightly leverage targeting property for RT-AV-001. And again, this is immunohistochemistraining. As you can see, this is really across all the brain regions, RT-AV-001. It was very factly transducing neuronal cells compared to AV-9, almost no positive staining was observed. And even including the spinal cord, up to 70% of the spinal neuronal, motor neurons are really transduced. And then when we quantify the neuronal transduction, about 30% to 70% of neurons are transduced depending on different brain regions, highly efficient. This is the signal monkey study and the same results. So I'm not gonna go through the details. And this is staining exactly, look like similar to resists monkey. We also took a look of the potential liability for anemia, liability for this particular capsule. Because as we know, transferring targeting can cause anemia and cause reticular sites reduction and real plus cells reduction. As you can see from here, really don't see any concerns of anemia. And at the same time, because of this AV-9 plus RT-AV,", "img": "frames/AAV_Engineering_IV/f0034.jpg"}, {"n": 35, "ts": "52:01–53:35", "key": "We also const col = document.getElementById('imgcol');

function applyT() {
  const img = document.getElementById('simg');
  img.style.transform = `scale(${sc}) translate(${tx}px,${ty}px)`;
}
function zoom(f) { sc = Math.min(8, Math.max(1, sc*f)); if(sc===1){tx=0;ty=0;} applyT(); }
function resetZoom() { sc=1; tx=0; ty=0; applyT(); }

col.addEventListener('wheel', e => {
  e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 0.87);
}, {passive:false});
col.addEventListener('mousedown', e => {
  if(sc<=1) return;
  dragging=true; startX=e.clientX-tx; startY=e.clientY-ty;
  col.classList.add('dragging');
});
window.addEventListener('mouseup', () => { dragging=false; col.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if(!dragging) return; tx=e.clientX-startX; ty=e.clientY-startY; applyT();
});
let lastDist=0;
col.addEventListener('touchstart', e => { if(e.touches.length===2) lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); });
col.addEventListener('touchmove', e => {
  if(e.touches.length!==2) return; e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  zoom(d/lastDist); lastDist=d;
},{passive:false});
</script>
</body>
</html>
