ry good high-fusility packaging with very low backbone contamination and excellent consistency of phenotype and genotype. A calibrator is our calibrated barcoded library. We use AV9 as internal standards", "img": "frames/AAV_Engineering_III/f0002.jpg"}, {"n": 3, "ts": "3:01–4:36", "key": "In chemo, we label the different variants with distinct epitope tags for multi-level capsaid benchmarking in a single animal.", "full": "with different doses. And then we create central curve based on the dosage of AV9 and the in vivo t-show expression. And then all variants are mapped to this curve to calculate normalized for the change against AV9. In chemo, we label the different variants with distinct epitope tags for multi-level capsaid benchmarking in a single animal. This is our signal recovery platform. We named the capture with magnetic bits contracted with a virus-specific probe to recover the viral MRI. And this method facilitated the RT preparation from a large amount of NHP tissues. This is our integrated dynamo-lib. We integrated multi-librates, multi-root, and multi-tissue screening, all in a single NHP model.", "img": "frames/AAV_Engineering_III/f0003.jpg"}, {"n": 4, "ts": "4:36–6:09", "key": "From intravenous delivery, we identified mild-cap series targeting to muscle and the lead candidate targeting to deep brain.", "full": "The aim is to maximize the data output per NHP. This strategy is very productive. From intravenous delivery, we identified mild-cap series targeting to muscle and the lead candidate targeting to deep brain. From intracecho delivery, we identified syn-cap series which can transduce almost all NHP looking at cells. Now we move to our discovery of muscle targeting motif. And this is the first round in vivo screening. At this early stage, we didn't find a reliable linear motif, but we found a very strong argument about the arginine accumulation across all clusters. In the second round screening, we eyes the selection pressure increase, R6, the arginine at the sixth position accumulated dramatically. And we then analyzed the round of the R6 anchor", "img": "frames/AAV_Engineering_III/f0004.jpg"}, {"n": 5, "ts": "6:10–7:41", "key": "revealed that dominant PRT motif across all the muscles and the heart.", "full": "revealed that dominant PRT motif across all the muscles and the heart. And then we recasturing fixed R energy and we confirmed that it's the first round R energy and we confirmed that it's the PRG motif. And then we verified this motif in different species and we select four PRG variants and package them individually, label them with different IPP attacks and mix them together and then admit to animal by intravenous injection. And we tested them in Rhesus macaque SDRS and two species of mice. And all the PRT variants show a higher muscle expression than AB9 and the best one is BY087. And then we further validated BY087 in Rhesus macaque", "img": "frames/AAV_Engineering_III/f0005.jpg"}, {"n": 6, "ts": "7:45–9:17", "key": "And the correlation analysis of the NNK library screening revealed that there is a very strong positive correlation between muscle expression and the liver expression.", "full": "and at the dose of five times the power of 12, VG protege, BY087 outperforms every now across DNA, MRI and protein levels in all tested muscles. And since we have already verified the PRG motif, then we did the optimization of this PRG motif and the structure modeling by alpha fold reveals that there is a distinct protrusion introduced by SALTPRG insertion of BY087. We hypothesized, optimized the and terminal of the PRG motif could be maximized the muscle potency of the PRG. So we established the next round of HP screening by NNK saturation library. And the correlation analysis of the NNK library screening revealed that there is a very strong positive correlation between muscle expression and the liver expression.", "img": "frames/AAV_Engineering_III/f0006.jpg"}, {"n": 7, "ts": "9:17–10:48", "key": "First, we identified the consensus sequence for muscle tropism, it is SAXY PRG.", "full": "First, we identified the consensus sequence for muscle tropism, it is SAXY PRG. And then we focus on the afterlife population as shown in the right color with high muscle expression and low liver expression compared to the background. We found a distinct Hesidian accumulation in the second position and the fourth position. We named it the H switch. And then we developed our next generation male cap from white lab direct evolution and the structure informed design using H switch. And also the AI guide discovery to expand our candidate. Finally, we got 32 unique next generation variants and we tested them using our calibrator platform. The result shows most of the next generation variants", "img": "frames/AAV_Engineering_III/f0007.jpg"}, {"n": 8, "ts": "10:49–12:24", "key": "And the H switch works in the same way very well in these variants.", "full": "show a higher muscle expression than BY 087. And the H switch works in the same way very well in these variants. When the double H incorporation achieves very high muscle liver ratio around 32 times and 23 times, it's much higher than the BY 087. It is only 3.8 fold. And the single H incorporation is also very effective. It reached the ratio of 17 fold. And then we selected the two kind of variants. The blue one is the muscle potency and the right one is the liberally targeting group. And for the right group, it's much published mile away. And this is the BY 438 result in calibrator.", "img": "frames/AAV_Engineering_III/f0008.jpg"}, {"n": 9, "ts": "12:26–13:55", "key": "And we can see the BY 483 expressed much higher MRI in muscles than liver.", "full": "And the linear, we can see the linear regression of AV9. And also we can see the muscle expression here for the BY 488, much higher than AV9. And with liver, less expressed in the liver. And then we make higher to higher comparison between BY 438 and AV9. And we can see the BY 483 expressed much higher MRI in muscles than liver. And only 40% MRI expression in liver compared to AV9. The protein, the IF 10 confirmed protein expression consistent with MRI expression. This is the last presentation slide. We did cross species validation in Santa Mogas for myocardium variants. And the H switch works very well in Santa Mogas. It's actually for the double H incorporation.", "img": "frames/AAV_Engineering_III/f0009.jpg"}, {"n": 10, "ts": "13:57–15:28", "key": "The myocype series, like BY 438, demonstrate a special muscle transduction and hepatic escape in other HP, serving as ideal vector for muscle-related gene therapy.", "full": "As shown in red color, the auto-perform the published control myocardium and VG7. For conclusion, Danily is end-to-end pipeline for calibrator discovery. And the PRD motif, so as a strong muscle targeting motif while flanking H residue, acts as a precise switch to abolish the level of targeting. The myocype series, like BY 438, demonstrate a special muscle transduction and hepatic escape in other HP, serving as ideal vector for muscle-related gene therapy. Thank you. Thank you. Thank you, Gang. Do we have any questions for Gang? We have one minute. I'm sorry, I may have missed it. Did you mention the receptor that you believe this is binding to? No, we are trying to find the receptor. Unfortunately, until now, we didn't find it. Hi, I'm nice to talk. You mentioned that you use dose calibration curve", "img": "frames/AAV_Engineering_III/f0010.jpg"}, {"n": 11, "ts": "15:28–16:59", "key": "Yeah, we have our algorithm, calibrated algorithm, and we use the change fold, change fold to represent the potency of each variant.", "full": "in your libraries. I'm curious how you use that data on the other end and what you've learned about dose response of various AV variants. You mean the mechanism of our calibrator? Yeah, like how you use the calibrator data? Yeah, we have our algorithm, calibrated algorithm, and we use the change fold, change fold to represent the potency of each variant. We get the T2 expression data, put them, might put them into the standard curve and then we will calculate the fold change compared to the standard curve. That means the increase fold against the AV9. Okay, thank you. Thank you, Gang. Thank you, Gang. With that, I would like to invite our next speaker, Benjamin, and he is my joint collaboration of the Tevira Therapeutics and the Department of Cellular and Molecular Medicine in Belgium, so welcome, Benjamin. Thank you, it's nice being here. So today I wanted to tell you a little bit", "img": "frames/AAV_Engineering_III/f0011.jpg"}, {"n": 12, "ts": "16:59–18:30", "key": "So I think I'm preaching to the choir here when I say that AV development is kind of hindered by the specificity and the potency of AV vectors and also the manufacturing can be sometimes always quite complex.", "full": "about what we have been doing with Tevira over the last year and we've been working on a novel capsa platform, which we call the DEV platform, some of my disclosures. So I think I'm preaching to the choir here when I say that AV development is kind of hindered by the specificity and the potency of AV vectors and also the manufacturing can be sometimes always quite complex. So at Tevira, we wondered, okay, can we make this more streamlined and more directed by zip coding AVs to send them directly to specific tissues in a rational way? And the way we did that is through what we call our DEV platform, stands for Decorated AVs. What we basically did is we started with a parental AV serotype and in our case, we checked the AV2 and AV9, but we went ahead with AV9 and we did some minimal vector engineering. What we did was we added in the surfaces post loops, we added a recognition tag for an enzyme called sortase A. And what happens is this sortase can recognize this tag and then when it does so it can attach targeting groups to the capsits and these targeting groups then afford specificity and
