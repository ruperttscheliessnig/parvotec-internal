risks:
  - risk: "VSMC / Leber Tradeoff nicht auflösbar"
    probability: "Mittel"
    impact: "Sehr Hoch"
    mitigation: "Periadventitiale Route eliminiert systemisches Leber-Off-target. Threshold auf 0.25 lockern möglich"
  - risk: "HUASMC Batch-Variabilität"
    probability: "Mittel"
    impact: "Mittel"
    mitigation: "Parallel-Freeze 50 Flaschen HUASMC bei Projektstart. Technische Triplikate für kritische Kandidaten"
  - risk: "SAXS Beamtime nicht verfügbar"
    probability: "Niedrig-Mittel"
    impact: "Mittel"
    mitigation: "Backup: Labor-SAXS (Xenocs Nano-inXider oder Rigaku BioSAXS-1000)"
  - risk: "CaCl₂-Modell keine Wirksamkeit"
    probability: "Niedrig"
    impact: "Hoch"
    mitigation: "Backup: AngII-ApoE⁻/⁻ Maus. Intraaortaler Katheter-Zugang als Alternative"
  - risk: "Oracle generalisiert nicht von HUASMC auf In Vivo VSMC"
    probability: "Niedrig-Mittel"
    impact: "Hoch"
    mitigation: "Validierung Top-5 in primären Ratten-VSMC (ex vivo Aorten-Stück-Assay) vor In-Vivo"

oracle:
  type: "Vascular Fitness Oracle"
  layers:
    - num: "Layer 1"
      title: "Embedding"
      desc: "ESM-2 650M\nFull VP1 + Insert\nOutput: 1280-dim"
    - num: "Layer 2"
      title: "Predictor"
      desc: "6-Task NN\nVSMC · EC · Leber\nRg · F:E · PDI"
    - num: "Layer 3"
      title: "Generator"
      desc: "cVAE mit\nNegativselektion\nLeber-Penalty"
    - num: "Layer 4"
      title: "Optimizer"
      desc: "Multi-obj. BO\nVSMC↑ EC↑ Leber↓\nPareto + Constraint"
  outputs:
    - name: "VSMC Tropismus"
      range: "0–1"
      weight: 0.35
      description: "Primäres Ziel — glatte Muskelzellen Aortenwand"
    - name: "EC Tropismus"
      range: "0–1"
      weight: 0.15
      description: "Sekundäres Ziel — Endothelzellen"
    - name: "Leber Off-target"
      range: "0–1"
      weight: 0.20
      description: "MINIMIEREN — hartes Constraint: >0.15 → disqualifiziert"
    - name: "Rg / SAXS"
      range: "nm"
      weight: 0.10
      description: "Strukturelle Integrität (normalisiert auf WT-AAV6)"
    - name: "Full:Empty Ratio"
      range: "0–1"
      weight: 0.15
      description: "Produktionseffizienz — therapeutisch relevante Partikel"
    - name: "PDI"
      range: "0–1"
      weight: 0.05
      description: "Polydispersitätsindex — Präparat-Homogenität"
