risks:
  - risk: "DMS Library Coverage <50%"
    probability: "Mittel"
    impact: "Hoch"
    mitigation: "Parallele Library mit kleinerer Komplexität als Backup"
  - risk: "Oracle generalisiert nicht auf neue Insertionen"
    probability: "Mittel"
    impact: "Mittel"
    mitigation: "Active Learning priorisiert unsichere Regionen, robuste Benchmarks"
  - risk: "Kein Kandidat erfüllt In-Vivo Kriterien M20"
    probability: "Niedrig-Mittel"
    impact: "Sehr Hoch"
    mitigation: "Frühzeitige In-Vivo Pilotdaten für Top-Kandidaten aus Runde 2"
  - risk: "IP-Konflikte mit WhiteLab/PackGene"
    probability: "Niedrig"
    impact: "Mittel"
    mitigation: "Freedom-to-Operate Analyse in WP1 (M1)"

oracle:
  type: "DRG Fitness Oracle"
  layers:
    - num: "Layer 1"
      title: "Embedding"
      desc: "ESM-2 650M / ESM-3 3B\nProtein Language Model\nOutput: 1280-dim Vektor"
    - num: "Layer 2"
      title: "Predictor"
      desc: "Feed-Forward NN\nMulti-task (4 Outputs)\nSpearman r ≥ 0.65"
    - num: "Layer 3"
      title: "Generator"
      desc: "Conditional VAE (cVAE)\nLatent Dim = 128\nConditional auf Fitness-Ziele"
    - num: "Layer 4"
      title: "Optimizer"
      desc: "Multi-objective Bayesian Opt.\nEHVI Acquisition Function\nPareto-Front Tracking"
  outputs:
    - name: "Tropismus Score"
      range: "0–1"
      weight: 0.5
      description: "Nozizeptive Neuron-Infektionseffizienz"
    - name: "Production Yield"
      range: "0–1"
      weight: 0.25
      description: "Relative AAV-Partikelproduktion vs. WT"
    - name: "Thermostabilität"
      range: "0–1"
      weight: 0.15
      description: "Schmelztemperatur normalisiert"
    - name: "Immunogenizität"
      range: "0–1"
      weight: 0.10
      description: "NAb-Titer-Vorhersage (niedrig = gut)"
