name: Deploy — Cloudflare Worker + R2

on:
  push:
    branches: [main]
    paths:
      # Re-deploy Worker when its source changes
      - 'cloudflare/worker/**'
      # Re-upload to R2 when any protected HTML changes
      - 'Machine learning for Rupert/transcripts/**.html'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_r2_upload:
        description: 'Force full R2 upload (even without HTML changes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  # ─── Job 1: Deploy Cloudflare Worker ─────────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'cloudflare/worker/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare/worker/package.json

      - name: Install wrangler
        run: npm ci
        working-directory: cloudflare/worker

      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Job 2: Upload protected HTML to R2 ──────────────────────────────────
  upload-r2:
    name: Upload HTML to R2
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'Machine learning for Rupert/transcripts/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare/worker/package.json

      - name: Install wrangler
        run: npm ci
        working-directory: cloudflare/worker

      - name: Upload HTML files to R2
        # Upload only files that changed in this push (or all on workflow_dispatch)
        run: |
          BUCKET="parvotec-private"
          TRANSCRIPT_DIR="Machine learning for Rupert/transcripts"

          upload() {
            local file="$1"
            local key="$2"
            if [ -f "$file" ]; then
              echo "→ $key"
              npx wrangler r2 object put "${BUCKET}/${key}" \
                --file "$file" \
                --content-type "text/html; charset=utf-8"
            fi
          }

          upload "${TRANSCRIPT_DIR}/parvotec_proposal_de.html"                "parvotec_proposal_de.html"
          upload "${TRANSCRIPT_DIR}/parvotec_proposal_en.html"                "parvotec_proposal_en.html"
          upload "${TRANSCRIPT_DIR}/parvotec_proposal.html"                   "parvotec_proposal.html"
          upload "${TRANSCRIPT_DIR}/parvotec_asgct2026_analysis.html"          "parvotec_asgct2026_analysis.html"
          upload "${TRANSCRIPT_DIR}/parvotec_asgct2026_analysis_bilingual.html" "parvotec_asgct2026_analysis_bilingual.html"
          upload "${TRANSCRIPT_DIR}/parvotec_app_workstation.html"             "parvotec_app_workstation.html"
          upload "${TRANSCRIPT_DIR}/parvotec_app_biophysics.html"              "parvotec_app_biophysics.html"
          upload "${TRANSCRIPT_DIR}/parvotec_app_computational.html"           "parvotec_app_computational.html"
          upload "${TRANSCRIPT_DIR}/parvotec_scientific_node.html"             "parvotec_scientific_node.html"
          upload "${TRANSCRIPT_DIR}/parvotec_workstation_wp.html"              "parvotec_workstation_wp.html"
          upload "${TRANSCRIPT_DIR}/parvotec_aorta_proposal.html"              "parvotec_aorta_proposal.html"
          upload "${TRANSCRIPT_DIR}/parvotec_aorta_saxs_analysis.html"         "parvotec_aorta_saxs_analysis.html"
          upload "${TRANSCRIPT_DIR}/index.html"                                "index.html"
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Job 3: Sync gh-pages (public GitHub Pages branch) ───────────────────
  sync-gh-pages:
    name: Sync gh-pages
    runs-on: ubuntu-latest
    needs: []   # runs in parallel with the Cloudflare jobs

    steps:
      - uses: actions/checkout@v4

      - name: Push main → gh-pages
        run: git push origin main:gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
